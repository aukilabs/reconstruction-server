name: Build Base Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - docker/Dockerfile.base
      - .github/workflows/build-base-image.yml

jobs:
  build-base-image:
    name: Build Base Image
    runs-on: [ubuntu-latest-4c16g150g]
    permissions:
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Image tags
        id: tags
        run: |
          set -eu
          owner="${GITHUB_REPOSITORY_OWNER}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/reconstruction-server-base:${GITHUB_SHA}"
            case "${GITHUB_REF}" in
              refs/heads/develop|refs/heads/main)
                echo "ghcr.io/${owner}/reconstruction-server-base:latest"
                ;;
            esac
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/Dockerfile.base
          push: true
          tags: ${{ steps.tags.outputs.tags }}
