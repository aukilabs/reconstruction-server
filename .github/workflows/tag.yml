name: Docker build and push

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: [ubuntu-latest-4c16g150g]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Update version in file
        run: |
          sed -i 's/VERSION = "develop"/VERSION = "${{ github.ref_name }}"/' utils/data_utils.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build and push
        id: docker-build-and-push
        env:
          DOCKER_BUILDKIT: "1"
          GLOBAL_AUKI_CHECKOUT_TOKEN: ${{ secrets.GLOBAL_AUKI_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${GLOBAL_AUKI_CHECKOUT_TOKEN}" ]; then
            echo "::error::GLOBAL_AUKI_CHECKOUT_TOKEN is empty. Add this repo to that org secret's repository access."
            exit 1
          fi
          docker build \
            --secret id=github_token,env=GLOBAL_AUKI_CHECKOUT_TOKEN \
            --build-arg "RECONSTRUCTION_VERSION=${{ github.ref_name }}" \
            -t "aukilabs/reconstruction-node:latest" \
            -t "aukilabs/reconstruction-node:${{ github.ref_name }}" \
            --push \
            -f docker/Dockerfile \
            .
