{{- if and .Values.keda.enabled .Values.keda.metricsToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-dms-task-metrics-token
  labels:
    app.kubernetes.io/name: reconstruction-server
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.keda.metricsTokenSecret.key | default "token" }}: {{ .Values.keda.metricsToken | quote }}
{{- end }}
