{{- if .Values.keda.enabled }}
{{- $dmsUrl := required "keda.dmsMetricsUrl is required when keda.enabled" .Values.keda.dmsMetricsUrl }}
{{- $query := list }}
{{- if .Values.keda.modes }}
{{- range .Values.keda.modes }}
{{- $query = append $query (printf "mode=%s" .) }}
{{- end }}
{{- end }}
{{- if not .Values.keda.modes }}
{{- fail "keda.modes must be set when keda.enabled" }}
{{- end }}
{{- range .Values.keda.taskTypes }}
{{- $query = append $query (printf "task_types=%s" (. | urlquery)) }}
{{- end }}
{{- range .Values.keda.statuses }}
{{- $query = append $query (printf "status=%s" .) }}
{{- end }}
{{- $metricsUrl := printf "%s?%s" $dmsUrl (join "&" $query) }}
{{- $needsBearer := has "dedicated" .Values.keda.modes }}
{{- $useBearer := or $needsBearer .Values.keda.metricsToken .Values.keda.metricsTokenSecret.name }}
{{- if and $needsBearer (not .Values.keda.metricsToken) (not .Values.keda.metricsTokenSecret.name) }}
{{- fail "keda.metricsTokenSecret.name (key DMS_TOKEN) or keda.metricsToken is required when modes includes dedicated" }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-recon
  labels:
    app.kubernetes.io/name: reconstruction-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: {{ .Values.keda.scaleTargetRef.apiVersion | default "apps/v1" }}
    kind: {{ .Values.keda.scaleTargetRef.kind | default "StatefulSet" }}
    name: {{ .Values.keda.scaleTargetRef.name | default .Release.Name }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers:
    - type: metrics-api
      metadata:
        url: {{ $metricsUrl | quote }}
        format: prometheus
        valueLocation: dms_tasks_scale
        targetValue: {{ .Values.keda.targetValue | quote }}
        activationTargetValue: {{ .Values.keda.activationTargetValue | quote }}
        {{- if $useBearer }}
        authMode: bearer
        {{- end }}
      {{- if $useBearer }}
      authenticationRef:
        name: {{ .Release.Name }}-dms-task-metrics
      {{- end }}
{{- end }}
