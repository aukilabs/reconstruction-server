{{- if and .Values.keda.enabled (or .Values.keda.metricsToken .Values.keda.metricsTokenSecret.name) }}
{{- $tokenSecretName := .Values.keda.metricsTokenSecret.name }}
{{- if .Values.keda.metricsToken }}
{{- $tokenSecretName = printf "%s-dms-task-metrics-token" .Release.Name }}
{{- else }}
{{- $tokenSecretName = required "keda.metricsToken or keda.metricsTokenSecret.name is required for bearer auth" $tokenSecretName }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Release.Name }}-dms-task-metrics
  labels:
    app.kubernetes.io/name: reconstruction-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  secretTargetRef:
    - parameter: token
      name: {{ $tokenSecretName }}
      key: {{ .Values.keda.metricsTokenSecret.key | default "token" }}
{{- end }}
