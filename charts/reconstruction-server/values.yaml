reconstruction-server:
  replicaCount: 0
  image:
    pullPolicy: Always
    tag: latest
  ingress:
    enabled: false
  resources:
    limits:
      cpu: 8
      memory: 12Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 6
      memory: 6Gi
  tolerations:
    - key: "dedicated"
      value: "karpenterGPU"
      effect: "NoSchedule"

keda:
  enabled: false
  dmsMetricsUrl: ""
  modes: []
  taskTypes:
    - /reconstruction/local-refinement/v1
    - /reconstruction/global-refinement/v1
  statuses:
    - queued
    - leased
    - running
  minReplicaCount: 0
  maxReplicaCount: 5
  targetValue: "1"
  activationTargetValue: "0"
  pollingInterval: 30
  cooldownPeriod: 300
  scaleTargetRef:
    name: ""
  metricsToken: ""
  metricsTokenSecret:
    name: ""
    key: DMS_TOKEN
