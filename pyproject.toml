[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstruction-server"
version = "0.0.0"
description = "Auki reconstruction node: the Python/C++ pipeline the Rust compute node runs"
readme = { file = "README.MD", content-type = "text/markdown" }
requires-python = ">=3.10"
# Names only, as documentation. docker/Dockerfile.base is the only place versions are pinned
# (pybind11, pyceres, COLMAP, torch, opencv and open3d must match each other), and the image never
# resolves dependencies from this file. Install into an environment that already has them:
#   pip install -e . --no-deps
dependencies = [
    "numpy",
    "scipy",
    "pycolmap",
    "pyceres",
    "hloc",  # installed from git in Dockerfile.base; not on PyPI
    "torch",
    "opencv-python",
    "open3d",
    "trimesh",
    "pyyaml",
    "python-dateutil",
    "psutil",
    "gputil",
]

[project.optional-dependencies]
# occlusion_box.py; disabled in main.py
occlusion = ["scikit-learn", "alphashape", "shapely", "matplotlib"]
test = ["pytest"]

[tool.setuptools]
# The pipeline is still a flat layout; list it explicitly so setuptools does not try to
# auto-discover packages among server/, docker/, tests/ and the rest.
py-modules = ["main", "local_main", "global_main", "update_main", "topology_main", "occlusion_box"]
# src/ holds the pybind11 modules, built in place by CMake (imported as src.<module>).
packages = ["utils", "src"]

[tool.pytest.ini_options]
# Tests are plain unittest; pytest is optional. Mirrors `PYTHONPATH=. python3 -m unittest discover -s tests`.
testpaths = ["tests"]
pythonpath = ["."]
