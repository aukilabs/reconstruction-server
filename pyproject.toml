[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstruction-server"
version = "0.0.0"
description = "Auki reconstruction node: the Python/C++ pipeline the Rust compute node runs"
readme = { file = "README.MD", content-type = "text/markdown" }
requires-python = ">=3.10"
# Names only, as documentation. docker/Dockerfile.base pins the versions (pybind11, pyceres, COLMAP,
# torch, opencv and open3d must match each other), except the Auki SDK bindings, which
# docker/build_auki_python.sh builds at the auki-sdk rev server/rust/Cargo.toml pins. The image never
# resolves dependencies from this file. Install into an environment that already has them:
#   pip install -e . --no-deps
dependencies = [
    "numpy",
    "scipy",
    "pycolmap",
    "pyceres",
    "hloc",  # installed from git in Dockerfile.base; not on PyPI
    "torch",
    "opencv-python",
    "open3d",
    "trimesh",
    "pyyaml",
    "python-dateutil",
    "psutil",
    "gputil",
    "auki-geometry-py",  # built from auki-sdk by docker/build_auki_python.sh; not on PyPI
]

[project.optional-dependencies]
# reconstruction.pipeline.occlusion; disabled in the global entry point
occlusion = ["scikit-learn", "alphashape", "shapely", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
# reconstruction/native/ holds the pybind11 modules that CMake builds from cpp/.
include = ["reconstruction*"]

[tool.pytest.ini_options]
# Tests are plain unittest; pytest is optional. Mirrors `PYTHONPATH=. python3 -m unittest discover -s tests`.
testpaths = ["tests"]
pythonpath = ["."]
