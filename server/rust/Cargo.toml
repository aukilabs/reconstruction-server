[workspace]
members = [
    "runner-reconstruction-update",
    "runner-reconstruction-global",
    "runner-reconstruction-local",
    "bin",
    "node-host",
]
resolver = "2"

[workspace.dependencies]
# Auki SDK task runtime; no crates.io release, so pin an exact develop revision.
auki-sdk = { git = "https://github.com/aukilabs/auki-sdk", rev = "a497e41cd0a72a99f397ef2cc6be2d31d3504420" }
auki-auth = { git = "https://github.com/aukilabs/auki-sdk", rev = "a497e41cd0a72a99f397ef2cc6be2d31d3504420" }
auki-dms = { git = "https://github.com/aukilabs/auki-sdk", rev = "a497e41cd0a72a99f397ef2cc6be2d31d3504420", default-features = false, features = ["client"] }

[workspace.package]
edition = "2021"
publish = false

# Metadata used by scripts/CI; clippy warnings are denied via CI commands.
[workspace.metadata.ci]
deny-warnings = true
