[package]
name = "bin"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
compute-runner-api = { package = "posemesh-compute-node-runner-api", version = "0.1.2" }
posemesh-compute-node = { git = "https://github.com/aukilabs/posemesh.git", rev = "c0f475c8cab0fc411cde19ea29869e5e1013993f" }
runner-reconstruction-local = { path = "../runner-reconstruction-local" }
runner-reconstruction-local-auki-sdk = { path = "../runner-reconstruction-local-auki-sdk" }
runner-reconstruction-global = { path = "../runner-reconstruction-global" }
runner-reconstruction-update = { path = "../runner-reconstruction-update" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[build-dependencies]
semver = "1"

[[bin]]
name = "compute-node"
path = "src/main.rs"
