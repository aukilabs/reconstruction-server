[package]
name = "node-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Compute-node host on the Auki SDK task runtime: claim loop, Domain IO and DMS receipts."

[dependencies]
anyhow = "1.0.95"
async-trait = "0.1.88"
auki-sdk = { workspace = true }
libc = "0.2"
parking_lot = "0.12"
regex = "1.11"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2"
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "json", "env-filter"] }
url = "2.5"
uuid = { version = "1.10.1", features = ["v4"] }

[dev-dependencies]
auki-auth = { workspace = true }
auki-dms = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
httpmock = "0.8"
tempfile = "3"
