[package]
name = "runner-reconstruction-common"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
node-host = { path = "../node-host" }
anyhow = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[package.metadata]
description = "Code the reconstruction runners share: starting Python, the job workspace, uploading outputs."
