[package]
name = "runner-reconstruction-local-auki-sdk"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
compute-runner-api = { package = "posemesh-compute-node-runner-api", version = "0.1.2" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
libp2p-identity = "0.2.14"
multiaddr = "0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = "1"
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
auki-p2p = { git = "https://github.com/aukilabs/posemesh.git", rev = "4bed3f76f440d45083ac04860b36fe0203439ea5" }
jsonwebtoken = "9"
posemesh-compute-node = { git = "https://github.com/aukilabs/posemesh.git", rev = "4bed3f76f440d45083ac04860b36fe0203439ea5" }
uuid = { version = "1", features = ["v4"] }

[package.metadata]
description = "Runner for local refinement of Auki SDK capture sessions fetched from an authenticated P2P reference."
