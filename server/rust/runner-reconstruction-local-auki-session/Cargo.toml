[package]
name = "runner-reconstruction-local-auki-session"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
node-host = { path = "../node-host" }
runner-reconstruction-common = { path = "../runner-reconstruction-common" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[package.metadata]
description = "Runner for local refinement of an Auki SDK capture session."
